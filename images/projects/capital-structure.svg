<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="DM Sans, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2447"/>
      <stop offset="55%" stop-color="#123055"/>
      <stop offset="100%" stop-color="#173F73"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>
  <rect width="800" height="450" fill="url(#grid5)"/>

  <text x="48" y="58" fill="#C8963E" font-size="13" letter-spacing="3" font-family="monospace">POWER BI · 226 COMPANIES</text>
  <text x="48" y="97" fill="#FFFFFF" font-size="29" font-weight="700" font-family="Georgia, serif">Capital Structure &amp; Performance</text>
  <line x1="48" y1="118" x2="752" y2="118" stroke="#FFFFFF" opacity="0.16" stroke-width="1"/>

  <!-- KPI strip -->
  <g transform="translate(48,136)">
    <rect x="0"   y="0" width="168" height="62" rx="8" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="84" y="30" fill="#C8963E" font-size="21" font-weight="700" font-family="Georgia, serif" text-anchor="middle">2.32x</text>
    <text x="84" y="48" fill="#9FC0E3" font-size="10.5" text-anchor="middle">Total leverage ratio</text>

    <rect x="180" y="0" width="168" height="62" rx="8" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="264" y="30" fill="#C8963E" font-size="21" font-weight="700" font-family="Georgia, serif" text-anchor="middle">21.3%</text>
    <text x="264" y="48" fill="#9FC0E3" font-size="10.5" text-anchor="middle">Wtd EBITDA margin</text>

    <rect x="360" y="0" width="168" height="62" rx="8" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="444" y="30" fill="#C8963E" font-size="21" font-weight="700" font-family="Georgia, serif" text-anchor="middle">0.15</text>
    <text x="444" y="48" fill="#9FC0E3" font-size="10.5" text-anchor="middle">Market D/E ratio</text>

    <rect x="540" y="0" width="164" height="62" rx="8" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="622" y="30" fill="#C8963E" font-size="21" font-weight="700" font-family="Georgia, serif" text-anchor="middle">$5.24T</text>
    <text x="622" y="48" fill="#9FC0E3" font-size="10.5" text-anchor="middle">Combined debt</text>
  </g>

  <!-- scatter -->
  <g transform="translate(48,218)">
    <rect width="392" height="182" rx="10" fill="#FFFFFF" opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="20" y="26" fill="#9FC0E3" font-size="11" letter-spacing="1.4" font-family="monospace">LEVERAGE vs CAPITAL EFFICIENCY</text>
    <line x1="40" y1="152" x2="366" y2="152" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <line x1="40" y1="152" x2="40" y2="44" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <circle cx="82"  cy="126" r="7"  fill="#5B8CBE" opacity="0.8"/>
    <circle cx="112" cy="112" r="11" fill="#C8963E" opacity="0.62"/>
    <circle cx="146" cy="132" r="6"  fill="#9FC0E3" opacity="0.75"/>
    <circle cx="168" cy="96"  r="14" fill="#C8963E" opacity="0.5"/>
    <circle cx="204" cy="118" r="8"  fill="#5B8CBE" opacity="0.8"/>
    <circle cx="232" cy="78"  r="10" fill="#E5B96C" opacity="0.6"/>
    <circle cx="262" cy="108" r="6"  fill="#9FC0E3" opacity="0.7"/>
    <circle cx="288" cy="66"  r="13" fill="#C8963E" opacity="0.52"/>
    <circle cx="318" cy="94"  r="7"  fill="#5B8CBE" opacity="0.75"/>
    <circle cx="342" cy="58"  r="9"  fill="#E5B96C" opacity="0.62"/>
    <text x="40" y="172" fill="#8FB0D4" font-size="9.5" font-family="monospace">CAPITAL EFFICIENCY SCORE →</text>
  </g>

  <!-- capital split -->
  <g transform="translate(460,218)">
    <rect width="292" height="182" rx="10" fill="#FFFFFF" opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="20" y="26" fill="#9FC0E3" font-size="11" letter-spacing="1.4" font-family="monospace">CAPITAL STRUCTURE SPLIT</text>
    <!-- donut: 87% equity / 13% debt -->
    <g transform="translate(84,108)">
      <circle r="42" fill="none" stroke="#5B8CBE" stroke-width="18" opacity="0.85"/>
      <circle r="42" fill="none" stroke="#C8963E" stroke-width="18"
              stroke-dasharray="34.3 229.5" stroke-dashoffset="66" transform="rotate(-90)"/>
    </g>
    <rect x="152" y="86" width="11" height="11" rx="2" fill="#5B8CBE"/>
    <text x="170" y="96" fill="#E4EEF9" font-size="12">Equity  86.7%</text>
    <rect x="152" y="112" width="11" height="11" rx="2" fill="#C8963E"/>
    <text x="170" y="122" fill="#E4EEF9" font-size="12">Debt  13.3%</text>
    <text x="20" y="166" fill="#CFE0F2" font-size="10.5">Star schema · 5 DAX measures</text>
  </g>
</svg>
