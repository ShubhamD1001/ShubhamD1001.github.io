<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="DM Sans, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2447"/>
      <stop offset="55%" stop-color="#123055"/>
      <stop offset="100%" stop-color="#173F73"/>
    </linearGradient>
    <pattern id="grid7" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg7)"/>
  <rect width="800" height="450" fill="url(#grid7)"/>

  <text x="48" y="58" fill="#C8963E" font-size="13" letter-spacing="3" font-family="monospace">GOOGLE MY MAPS · 8 NODES · 5 ROUTES</text>
  <text x="48" y="97" fill="#FFFFFF" font-size="29" font-weight="700" font-family="Georgia, serif">Global Supply Chain Network</text>
  <line x1="48" y1="118" x2="752" y2="118" stroke="#FFFFFF" opacity="0.16" stroke-width="1"/>

  <!-- network schematic -->
  <g transform="translate(48,138)">
    <rect width="452" height="262" rx="10" fill="#FFFFFF" opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="22" y="28" fill="#9FC0E3" font-size="11" letter-spacing="1.4" font-family="monospace">FOUR-TIER NETWORK</text>

    <!-- tier labels -->
    <text x="22" y="58" fill="#8FB0D4" font-size="9.5" font-family="monospace">TIER 1</text>
    <text x="152" y="58" fill="#8FB0D4" font-size="9.5" font-family="monospace">ASSEMBLY</text>
    <text x="272" y="58" fill="#8FB0D4" font-size="9.5" font-family="monospace">DC</text>
    <text x="372" y="58" fill="#8FB0D4" font-size="9.5" font-family="monospace">RETAIL</text>

    <!-- routes -->
    <path d="M64 92 C 110 92, 120 118, 168 118" fill="none" stroke="#E5B96C" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M64 156 C 110 156, 120 130, 168 130" fill="none" stroke="#5B8CBE" stroke-width="2.5"/>
    <path d="M196 118 C 240 100, 250 96, 296 96" fill="none" stroke="#5B8CBE" stroke-width="2.5"/>
    <path d="M196 130 C 240 158, 250 166, 296 166" fill="none" stroke="#5B8CBE" stroke-width="2.5"/>
    <path d="M196 124 C 250 124, 300 210, 396 210" fill="none" stroke="#9B7FD4" stroke-width="2.5"/>
    <path d="M320 96 C 356 96, 366 92, 396 92" fill="none" stroke="#9B7FD4" stroke-width="2.5"/>
    <path d="M320 166 C 356 166, 366 152, 396 152" fill="none" stroke="#A9743E" stroke-width="2.5"/>

    <!-- nodes -->
    <circle cx="52" cy="92" r="11" fill="#4ADE80" opacity="0.9"/>
    <text x="52" y="96" fill="#06301B" font-size="9" font-weight="700" text-anchor="middle">TW</text>
    <text x="22" y="118" fill="#E4EEF9" font-size="10">Hsinchu — chips</text>

    <circle cx="52" cy="156" r="11" fill="#4ADE80" opacity="0.9"/>
    <text x="52" y="160" fill="#06301B" font-size="9" font-weight="700" text-anchor="middle">CL</text>
    <text x="22" y="182" fill="#E4EEF9" font-size="10">Antofagasta — lithium</text>

    <circle cx="182" cy="124" r="13" fill="#C8963E"/>
    <text x="182" y="128" fill="#231704" font-size="9" font-weight="700" text-anchor="middle">CN</text>
    <text x="150" y="150" fill="#E4EEF9" font-size="10">Shenzhen</text>

    <circle cx="308" cy="96" r="10" fill="#9B7FD4" opacity="0.9"/>
    <text x="288" y="80" fill="#E4EEF9" font-size="10">Rotterdam</text>
    <circle cx="308" cy="166" r="10" fill="#9B7FD4" opacity="0.9"/>
    <text x="288" y="190" fill="#E4EEF9" font-size="10">Los Angeles</text>

    <circle cx="406" cy="92" r="8" fill="#5B8CBE"/>
    <text x="392" y="76" fill="#CFE0F2" font-size="10">London</text>
    <circle cx="406" cy="152" r="8" fill="#5B8CBE"/>
    <text x="392" y="140" fill="#CFE0F2" font-size="10">New York</text>
    <circle cx="406" cy="210" r="8" fill="#5B8CBE"/>
    <text x="392" y="232" fill="#CFE0F2" font-size="10">Tokyo</text>

    <!-- legend -->
    <line x1="22" y1="228" x2="52" y2="228" stroke="#E5B96C" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="60" y="232" fill="#CFE0F2" font-size="10">Air</text>
    <line x1="96" y1="228" x2="126" y2="228" stroke="#5B8CBE" stroke-width="2.5"/>
    <text x="134" y="232" fill="#CFE0F2" font-size="10">Ocean</text>
    <line x1="188" y1="228" x2="218" y2="228" stroke="#9B7FD4" stroke-width="2.5"/>
    <text x="226" y="232" fill="#CFE0F2" font-size="10">Multimodal</text>
    <line x1="308" y1="228" x2="338" y2="228" stroke="#A9743E" stroke-width="2.5"/>
    <text x="346" y="232" fill="#CFE0F2" font-size="10">Ocean → rail</text>
  </g>

  <!-- risk panel -->
  <g transform="translate(520,138)">
    <rect width="232" height="262" rx="10" fill="#FFFFFF" opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="20" y="28" fill="#9FC0E3" font-size="11" letter-spacing="1.4" font-family="monospace">CHOKE POINTS</text>

    <circle cx="30" cy="58" r="6" fill="#F0857F"/>
    <text x="46" y="62" fill="#E4EEF9" font-size="12.5">Strait of Malacca</text>
    <circle cx="30" cy="88" r="6" fill="#F0857F"/>
    <text x="46" y="92" fill="#E4EEF9" font-size="12.5">Suez Canal</text>

    <line x1="20" y1="112" x2="212" y2="112" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <text x="20" y="136" fill="#9FC0E3" font-size="11" letter-spacing="1.4" font-family="monospace">IF DISRUPTED</text>
    <text x="20" y="162" fill="#C8963E" font-size="26" font-weight="700" font-family="Georgia, serif">+10–15</text>
    <text x="20" y="180" fill="#CFE0F2" font-size="11.5">days rerouting via Cape of</text>
    <text x="20" y="196" fill="#CFE0F2" font-size="11.5">Good Hope</text>

    <line x1="20" y1="214" x2="212" y2="214" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="20" y="236" fill="#EBC57F" font-size="11">Air-freight recovery erases</text>
    <text x="20" y="250" fill="#EBC57F" font-size="11">the product's margin.</text>
  </g>
</svg>
