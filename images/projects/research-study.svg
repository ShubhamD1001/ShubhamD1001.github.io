    <text x="22" y="120" fill="#E4EEF9" font-size="12.5">Fear being judged on their English</text>
    <rect x="22" y="128" width="348" height="16" rx="4" fill="#FFFFFF" opacity="0.09"/>
    <rect x="22" y="128" width="299" height="16" rx="4" fill="#C8963E" opacity="0.9"/>
    <text x="304" y="141" fill="#231704" font-size="12" font-weight="700" font-family="monospace">85.8%</text>

    <text x="22" y="174" fill="#E4EEF9" font-size="12.5">Prefer texts by Indian authors</text>
    <rect x="22" y="182" width="348" height="16" rx="4" fill="#FFFFFF" opacity="0.09"/>
    <rect x="22" y="182" width="249" height="16" rx="4" fill="#5B8CBE" opacity="0.9"/>
    <text x="304" y="195" fill="#CFE0F2" font-size="12" font-weight="700" font-family="monospace">71.6%</text>

